name: Daily AI Topic

on:
  schedule:
    - cron: "0 1 * * *"   # BD time sokal 7:00 (UTC 01:00)
  workflow_dispatch:
    inputs:
      start_topic:
        description: "Je topic number theke video shuru hobe (1 = prothom)"
        required: false
        default: "1"

permissions:
  contents: write

concurrency:
  group: daily-ai-topic
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          pip install pillow

      - name: Generate topic
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python generate.py

      - name: Generate video
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          START_TOPIC: ${{ github.event.inputs.start_topic || '1' }}
        run: python video.py

      - name: Commit and push
        run: |
          git config user.name "nomancsediu"
          git config user.email "nomancsediu@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Add daily AI topic: $(date -u +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
